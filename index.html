<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Island RPG</title>
<style>html,body{margin:0;padding:0;width:100%;height:100%;background:#050505;overflow:hidden;touch-action:none;user-select:none;font-family:Arial,sans-serif}#g{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none}#err{position:absolute;top:0;left:0;width:100%;background:#e74c3c;color:#fff;font:14px monospace;padding:10px;display:none;z-index:9999}</style>
<script>window.onerror=function(m,u,l){var e=document.getElementById('err');if(e){e.style.display='block';e.innerHTML+='ОШИБКА: '+m+'<br>Строка: '+l;}}</script>

<body><div id="err"></div><canvas id="g" width="960" height="540"></canvas><script>
'use strict';
var c=document.getElementById('g'),x=c.getContext('2d'),W=960,H=540;
var ac;
function initA(){if(!ac){var A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A();}if(ac&&ac.state==='suspended')ac.resume();}
function snd(f,t,d,v,s){if(!ac)return;try{var o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.setValueAtTime(f,ac.currentTime);if(s)o.frequency.exponentialRampToValueAtTime(s,ac.currentTime+d);g.gain.setValueAtTime(v||0.1,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.01,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
function sClick(){snd(600,'square',0.1,0.1,200);}function sHit(){snd(150,'sawtooth',0.3,0.2,30);}function sShoot(){snd(800,'square',0.1,0.1,300);}function sDie(){snd(300,'sawtooth',1,0.3,10);}function sLoot(){snd(800,'triangle',0.2,0.1,1600);}

var SK='rpg_v25',sv={coins:0,mLvl:1,eW:'sword',eS:'none',oW:['sword'],oS:['none'],P:{armor:0,vamp:0,double:0,crit:0,cdr:0,merc:0},C:{heal:2,revive:1,bomb:0,freeze:0,speed:0},Cr:{s:0,m:0,l:0},quest:null,qDate:'',best:0};
try{var ss=localStorage.getItem(SK);if(ss){var s=JSON.parse(ss);if(s){for(var k in s)sv[k]=s[k];}}}catch(e){}
function save(){try{localStorage.setItem(SK,JSON.stringify(sv));}catch(e){}}

var SKS={none:{n:'Рыцарь',c:'#3498db',p:0},gold:{n:'Золотой',c:'#f1c40f',p:1000},neon:{n:'Ниндзя',c:'#00ffcc',p:2500},robot:{n:'Робот',c:'#95a5a6',p:5000}};
var WPS={sword:{n:'Меч',d:2,cd:0.2,t:'melee',c:'#ecf0f1',p:0},axe:{n:'Топор',d:5,cd:0.5,t:'arc',c:'#f39c12',p:800},bow:{n:'Лук',d:3,cd:0.3,t:'multi',c:'#2ecc71',p:1500},staff:{n:'Посох',d:7,cd:0.6,t:'magic',c:'#9b59b6',p:3000}};
var ETS={gob:{hp:15,s:90,d:12,r:16,c:'#2ecc71',sc:10,t:'m'},bat:{hp:10,s:180,d:15,r:14,c:'#8e44ad',sc:15,t:'f'},orc:{hp:60,s:50,d:25,r:24,c:'#d35400',sc:30,t:'t'},shoot:{hp:20,s:80,d:15,r:16,c:'#3498db',sc:25,t:'r'}};
var BSS={k:{n:'Король',hp:800,s:70,d:40,r:45,c:'#27ae60',sc:500,r:1},d:{n:'Демон',hp:1500,s:100,d:60,r:50,c:'#e74c3c',sc:1000,r:1}};
var CRS={s:{n:'Малый',p:300,c:'#8e44ad'},m:{n:'Средний',p:1000,c:'#2980b9'},l:{n:'Большой',p:3000,c:'#c0392b'}};
var ITM=[{i:'heal',n:'Аптечка',p:200,c:'#e74c3c',t:'c'},{i:'revive',n:'Возрождение',p:1000,c:'#f1c40f',t:'c'},{i:'bomb',n:'Бомба',p:500,c:'#d35400',t:'c'},{i:'armor',n:'Броня',p:1500,c:'#7f8c8d',t:'p'},{i:'vamp',n:'Вампиризм',p:2000,c:'#c0392b',t:'p'},{i:'double',n:'Двойной выстрел',p:3000,c:'#9b59b6',t:'p'},{i:'crit',n:'Крит',p:2500,c:'#e67e22',t:'p'},{i:'cdr',n:'Перезарядка',p:1800,c:'#34495e',t:'p'},{i:'merc',n:'Ботинки',p:4000,c:'#00bcd4',t:'p'}];

var S='menu',M='camp',L=1,Sc=0,CE=0,bul=[],en=[],eb=[],pt=[],obs=[],pck=[],txt=[],bts=[],lt=Date.now(),shk=0,shkI=0,step=0;
var p={x:W/2,y:H/2,r:18,hp:100,mh:100,cd:0,inv:0,ax:1,ay:0,wp:null,dmg:0,s:220,fr:0,sp:0};
var tL={id:null,dx:0,dy:0,nx:0,ny:0},tR={id:null,dx:0,dy:0,act:0},tA={id:null};
var LJ={x:120,y:H-120,R:70},RJ={x:W-120,y:H-120,R:70},AJ={x:W-120,y:H-220,R:40};
var st=0,sw=1,ss='break',stim=3,toSpawn=0,ab={t:0,cd:0},tab='items',itab='weapons',canim={act:0,t:0,rew:'',c:'#fff'};

if(sv.qDate!==new Date().toDateString()){
  var qt=[{t:'kill',n:15,x:'Убить 15 врагов'},{t:'lvl',n:2,x:'Пройти 2 уровня'},{t:'surv',n:60,x:'Выжить 60 секунд'}];
  var rq=qt[Math.floor(Math.random()*qt.length)];
  sv.quest={t:rq.t,tg:rq.n,x:rq.x,p:0,cl:0};sv.qDate=new Date().toDateString();save();
}

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}function dist(x1,y1,x2,y2){var dx=x2-x1,dy=y2-y1;return Math.sqrt(dx*dx+dy*dy);}function cp(cx,cy){var r=c.getBoundingClientRect();return{x:(cx-r.left)*W/r.width,y:(cy-r.top)*H/r.height};}function aT(t,x,y,c){txt.push({t:t,x:x,y:y,l:1,c:c});}

function apply(){var w=WPS[sv.eW];p.mh=100+sv.P.armor*10;p.hp=p.mh;p.s=220*(1+sv.P.merc*0.2);p.dmg=w.d+sv.P.crit;p.wp=w;p.wp.cd=Math.max(0.05,w.cd-sv.P.cdr*0.05);}
window.startLvl=function(n){
  if(typeof n!=='number')n=1;M='camp';L=n;apply();p.x=W/2;p.y=H/2;p.inv=1;p.cd=0;ab.cd=0;ab.t=0;p.fr=0;p.sp=0;
  bul=[];en=[];eb=[];pt=[];obs=[];pck=[];shk=0;txt=[];
  for(var i=0;i<3;i++)obs.push({x:150+Math.random()*(W-300),y:150+Math.random()*(H-300),r:35});
  toSpawn=5+(L*2);for(var i=0;i<Math.min(5,toSpawn);i++){sE();toSpawn--;}
  if(L%5===0)sB();S='play';tL.id=null;tR.id=null;tR.act=0;tA.id=null;
};
window.startSurv=function(){
  M='surv';apply();p.x=W/2;p.y=H/2;p.inv=1;p.cd=0;ab.cd=0;ab.t=0;p.fr=0;p.sp=0;
  bul=[];en=[];eb=[];pt=[];obs=[];pck=[];shk=0;txt=[];
  st=0;sw=1;ss='break';stim=5;S='surv';tL.id=null;tR.id=null;tR.act=0;tA.id=null;
};
window.tapAbility=function(){if(ab.cd>0||ab.t>0)return;ab.cd=15-sv.P.cdr*2;ab.t=5;};

function sB(){var k=Object.keys(BSS),b=BSS[k[Math.floor(Math.random()*k.length)]];en.push({x:W/2,y:150,r:b.r,hp:b.hp,mh:b.hp,s:b.s,d:b.d,c:b.c,sc:b.sc,hit:0,r:b.r,st:0,boss:1});sDie();}
function sW(){var cnt=5+Math.floor(sw*2);for(var i=0;i<cnt;i++)sE();if(sw%5===0)sB();ss='wave';}
function sE(){var k=Object.keys(ETS),b=ETS[k[Math.floor(Math.random()*k.length)]],side=Math.floor(Math.random()*4),X,Y,pd=50;
  if(side===0){X=Math.random()*W;Y=-pd;}else if(side===1){X=W+pd;Y=Math.random()*H;}else if(side===2){X=Math.random()*W;Y=H+pd;}else{X=-pd;Y=Math.random()*H;}
  var hm=1;if(M==='surv')hm=1+sw*0.5;
  en.push({x:X,y:Y,r:b.r,hp:b.hp*hm,mh:b.hp*hm,s:b.s*(1+sw*0.1),d:b.d*(1+sw*0.2),c:b.c,sc:b.sc,hit:0,t:b.t,st:0,r:b.t==='r'});}
function boom(x,y,c,n){n=n||10;for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=40+Math.random()*200;pt.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:2+Math.random()*4,l:0.5,c:c});}}

function openCrate(t){
  if(sv.Cr[t]<=0)return;sv.Cr[t]--;
  var r=Math.random(),rew='',rc='#fff';
  if(t==='s'){if(r<0.6){var c=100+Math.floor(Math.random()*200);sv.coins+=c;rew=c+" Монет";rc='#f1c40f';}else if(r<0.9){sv.C.heal++;rew="Аптечка";rc='#e74c3c';}else{sv.Cr.m++;rew="Средний Ящик!";rc='#2980b9';}}
  else if(t==='m'){if(r<0.5){var c=500+Math.floor(Math.random()*500);sv.coins+=c;rew=c+" Монет";rc='#f1c40f';}else{var w=Object.keys(WPS),nw=w[Math.floor(Math.random()*w.length)];if(sv.oW.indexOf(nw)===-1){sv.oW.push(nw);rew="Оружие: "+WPS[nw].n;rc='#2ecc71';}else{sv.coins+=1000;rew="1000 Монет";rc='#f1c40f';}}}
  else{if(r<0.3){var c=2000+Math.floor(Math.random()*1000);sv.coins+=c;rew=c+" Монет";rc='#f1c40f';}else{var s=Object.keys(SKS),ns=s[Math.floor(Math.random()*s.length)];if(sv.oS.indexOf(ns)===-1){sv.oS.push(ns);rew="Скин: "+SKS[ns].n;rc='#3498db';}else{sv.coins+=3000;rew="3000 Монет";rc='#f1c40f';}}}
  canim.act=1;canim.t=2.5;canim.rew=rew;canim.c=rc;save();sLoot();
}

c.addEventListener('touchstart',function(e){
  e.preventDefault();initA();
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i],pos=cp(t.clientX,t.clientY);
    if(S!=='play'&&S!=='surv'){tap(pos.x,pos.y);continue;}
    if(pos.x<W/2&&tL.id===null)tL.id=t.identifier;
    else if(pos.y<H-150&&pos.x>=W/2&&tA.id===null){tA.id=t.identifier;window.tapAbility();}
    else if(pos.x>=W/2&&tR.id===null){tR.id=t.identifier;tR.act=1;}
  }
},{passive:false});
c.addEventListener('touchmove',function(e){
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i],pos=cp(t.clientX,t.clientY);
    if(t.identifier===tL.id){var dx=pos.x-LJ.x,dy=pos.y-LJ.y,l=Math.sqrt(dx*dx+dy*dy);if(l>LJ.R){dx=dx/l*LJ.R;dy=dy/l*LJ.R;}tL.dx=dx;tL.dy=dy;tL.nx=dx/LJ.R;tL.ny=dy/LJ.R;}
    if(t.identifier===tR.id){var dx2=pos.x-RJ.x,dy2=pos.y-RJ.y,l2=Math.sqrt(dx2*dx2+dy2*dy2);if(l2>RJ.R){dx2=dx2/l2*RJ.R;dy2=dy2/l2*RJ.R;}tR.dx=dx2;tR.dy=dy2;}
  }
},{passive:false});
function endT(e){e.preventDefault();for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];if(t.identifier===tL.id){tL.id=null;tL.dx=0;tL.dy=0;tL.nx=0;tL.ny=0;}if(t.identifier===tR.id){tR.id=null;tR.act=0;tR.dx=0;tR.dy=0;}if(t.identifier===tA.id){tA.id=null;}}}
c.addEventListener('touchend',endT,{passive:false});c.addEventListener('touchcancel',endT,{passive:false});
function tap(px,py){for(var i=0;i<bts.length;i++){var b=bts[i];if(px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h){sClick();b.cb();return;}}}

function update(dt){
  if(shk>0)shk-=dt;if(ab.t>0)ab.t-=dt;if(ab.cd>0)ab.cd-=dt;if(p.fr>0)p.fr-=dt;if(p.sp>0)p.sp-=dt;
  var dx=tL.nx,dy=tL.ny,l=Math.sqrt(dx*dx+dy*dy);if(l>1){dx/=l;dy/=l;}
  var cs=p.s*(p.sp>0?2:1);
  var nx=p.x+dx*cs*dt,ny=p.y+dy*cs*dt;
  for(var i=0;i<obs.length;i++){var d=dist(nx,ny,obs[i].x,obs[i].y);if(d<p.r+obs[i].r){var ov=p.r+obs[i].r-d;var an=Math.atan2(ny-obs[i].y,nx-obs[i].x);nx+=Math.cos(an)*ov;ny+=Math.sin(an)*ov;}}
  p.x=clamp(nx,p.r,W-p.r);p.y=clamp(ny,p.r,H-p.r);
  if(p.inv>0)p.inv-=dt;
  if(tR.act){var tl=Math.sqrt(tR.dx*tR.dx+tR.dy*tR.dy);if(tl>12){p.ax=tR.dx/tl;p.ay=tR.dy/tl;}}
  p.cd-=dt;
  if(tR.act&&p.cd<=0){
    p.cd=p.wp.cd;var ang=Math.atan2(p.ay,p.ax);
    var dmg=p.dmg*(Math.random()<sv.P.crit*0.1?2:1);
    if(p.wp.t==='melee')bul.push({x:p.x,y:p.y,vx:Math.cos(ang)*600,vy:Math.sin(ang)*600,r:18,l:0.25,d:dmg,c:p.wp.c,pierce:1});
    else if(p.wp.t==='arc'){for(var k=-1;k<=1;k++)bul.push({x:p.x,y:p.y,vx:Math.cos(ang+k*0.3)*500,vy:Math.sin(ang+k*0.3)*500,r:14,l:0.4,d:dmg,c:p.wp.c});}
    else if(p.wp.t==='multi'){for(var k=-1;k<=1;k++)bul.push({x:p.x,y:p.y,vx:Math.cos(ang+k*0.2)*800,vy:Math.sin(ang+k*0.2)*800,r:8,l:1,d:dmg,c:p.wp.c});}
    else if(p.wp.t==='magic'){bul.push({x:p.x,y:p.y,vx:Math.cos(ang)*500,vy:Math.sin(ang)*500,r:20,l:1.5,d:dmg,c:p.wp.c,pierce:1});}
    if(sv.P.double>0)bul.push({x:p.x,y:p.y,vx:Math.cos(ang+0.2)*600,vy:Math.sin(ang+0.2)*600,r:8,l:1,d:dmg,c:p.wp.c});
    sShoot();
  }
  if(M==='surv'){
    if(ss==='break'){stim-=dt;if(stim<=0){sW();ss='wave';}}
    else{st+=dt;if(en.length===0){ss='break';stim=5;sw++;sv.coins+=50+sw*15;save();}}
  }
  if(M==='play'&&toSpawn>0&&en.length<8&&Math.random()<0.03){sE();toSpawn--;}
  for(var i=bul.length-1;i>=0;i--){var b=bul[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;if(b.l<=0||b.x<-50||b.x>W+50||b.y<-50||b.y>H+50){bul.splice(i,1);continue;}for(var j=0;j<obs.length;j++){if(dist(b.x,b.y,obs[j].x,obs[j].y)<obs[j].r){boom(b.x,b.y,'#888');if(!b.pierce)bul.splice(i,1);break;}}}
  for(var i=en.length-1;i>=0;i--){
    var e=en[i];if(e.hit>0)e.hit-=dt;var ax=p.x-e.x,ay=p.y-e.y,d=Math.sqrt(ax*ax+ay*ay)||1;
    e.x=clamp(e.x,e.r,W-e.r);e.y=clamp(e.y,e.r,H-e.r);
    if(p.fr>0){}else if(e.r){
      if(d>250){e.x+=ax/d*e.s*dt;e.y+=ay/d*e.s*dt;}else if(d<150){e.x-=ax/d*e.s*dt;e.y-=ay/d*e.s*dt;}else{e.x-=ax/d*10*dt;e.y-=ay/d*10*dt;}
      e.st-=dt;if(e.st<=0){e.st=2.5;var ea=Math.atan2(ay,ax);eb.push({x:e.x,y:e.y,vx:Math.cos(ea)*300,vy:Math.sin(ea)*300,r:8,l:3,d:e.d,c:'#3498db'});}
    }else{e.x+=ax/d*e.s*dt;e.y+=ay/d*e.s*dt;}
    if(d<e.r+p.r&&p.inv<=0&&ab.t<=0){p.hp-=e.d*(1-sv.P.armor*0.1);p.inv=1;shk=0.3;shkI=10;sHit();}
    for(var j=bul.length-1;j>=0;j--){var b=bul[j];if(dist(b.x,b.y,e.x,e.y)<e.r+b.r){
      if(!b.pierce)bul.splice(j,1);e.hp-=b.d;e.hit=0.1;boom(b.x,b.y,e.c,5);
      if(e.hp<=0){
        Sc+=e.sc;boom(e.x,e.y,e.c,20);en.splice(i,1);sLoot();
        if(sv.P.vamp>0)p.hp=Math.min(p.mh,p.hp+sv.P.vamp*2);
        if(sv.quest&&sv.quest.t==='kill'&&!sv.quest.cl)sv.quest.p++;
        save();
        if(Math.random()<0.2)pck.push({x:e.x,y:e.y,r:12,t:'h',l:10});
        if(Math.random()<0.4)pck.push({x:e.x,y:e.y,r:10,t:'c',l:10});
        break;
      }
    }}
  }
  for(var i=eb.length-1;i>=0;i--){var b=eb[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;if(b.l<=0){eb.splice(i,1);continue;}if(dist(b.x,b.y,p.x,p.y)<b.r+p.r&&p.inv<=0&&ab.t<=0){p.hp-=b.d*(1-sv.P.armor*0.1);p.inv=1;shk=0.3;sHit();eb.splice(i,1);}}
  for(var i=pck.length-1;i>=0;i--){var pk=pck[i];pk.l-=dt;if(pk.l<=0){pck.splice(i,1);continue;}if(dist(pk.x,pk.y,p.x,p.y)<pk.r+p.r+15){if(pk.t==='h'){p.hp=Math.min(p.mh,p.hp+40);aT('+40 HP',p.x,p.y-20,'#2ecc71');}else{sv.coins+=20;aT('+20',p.x,p.y-20,'#f1c40f');}sLoot();pck.splice(i,1);}}
  for(var i=pt.length-1;i>=0;i--){var pp=pt[i];pp.x+=pp.vx*dt;pp.y+=pp.vy*dt;pp.l-=dt;if(pp.l<=0)pt.splice(i,1);}
  for(var i=txt.length-1;i>=0;i--){txt[i].y-=40*dt;txt[i].l-=dt;if(txt[i].l<=0)txt.splice(i,1);}
  if(p.hp<=0){
    if(sv.C.revive>0){sv.C.revive--;p.hp=p.mh*0.5;p.inv=2;save();aT('ВОЗРОЖДЕНИЕ!',p.x,p.y-40,'#e74c3c');}
    else{shk=0;sDie();if(M==='surv'){if(st>sv.best){sv.best=st;save();}S='survOver';}else S='over';}
  }else if(M==='play'&&toSpawn===0&&en.length===0){
    CE=100+L*20;sv.coins+=CE;if(L>=sv.mLvl)sv.mLvl=L+1;
    if(sv.quest&&sv.quest.t==='lvl'&&!sv.quest.cl)sv.quest.p++;
    save();shk=0;S='clear';
  }
}

function dBG(){var g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f111a');g.addColorStop(1,'#1c1f2b');x.fillStyle=g;x.fillRect(0,0,W,H);x.strokeStyle='rgba(255,255,255,0.03)';x.lineWidth=1;for(var i=0;i<W;i+=60){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke();}for(var i=0;i<H;i+=60){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke();}}
function dBtn(x1,y1,w,h,txt,cb){
  x.fillStyle='#800000';x.fillRect(x1+4,y1+4,w,h);x.fillStyle='#000';x.fillRect(x1-4,y1-4,w+8,h+8);x.fillStyle='#ff3333';x.fillRect(x1,y1,w,h);x.fillStyle='#ff6666';x.fillRect(x1+4,y1+4,w-8,6);x.fillStyle='#aa0000';x.fillRect(x1,y1+h-8,w,8);
  x.fillStyle='#000';x.font='bold 20px "Courier New",monospace';x.textAlign='center';x.textBaseline='middle';x.fillText(txt,x1+w/2,y1+h/2);
  bts.push({x:x1-4,y:y1-4,w:w+8,h:h+8,cb:cb});
}
